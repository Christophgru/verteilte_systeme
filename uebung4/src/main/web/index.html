<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta charset="UTF-8" />
  <title>gRPC Chat Client</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 16px;
    }
    #chat-log {
      width: 100%;
      height: 200px;
      margin-top: 8px;
    }
    #users {
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #ccc;
      min-height: 40px;
    }
    .row {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <h1>Chat (gRPC-Web)</h1>

  <div class="row">
    <label>
      Username:
      <input id="username" type="text" />
    </label>
    <button id="login-btn">Login</button>
    <button id="logout-btn" disabled>Logout</button>
  </div>

  <div class="row">
    <textarea id="chat-log" readonly></textarea>
  </div>

  <div class="row">
    <input id="message-input" type="text" placeholder="Type a message..." />
    <button id="send-btn" disabled>Send</button>
    <button id="list-users-btn" disabled>List users</button>
  </div>

  <div class="row">
    <strong>Online users:</strong>
    <div id="users"></div>
  </div>

  <!-- The JS bundle built from app.js (via webpack/vite/etc.) build it using $npx webpack in src/main/web  -->
  <script src="public/bundle.js"></script>
</body>
</html>
